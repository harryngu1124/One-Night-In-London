<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Night in London</title>
  <style>
    :root{
      --gold:#b7791f;
      --gold-soft:#cf9b49;
      --ink:#171717;
      --cream:#fffaf2;
      --panel:rgba(255,250,242,.88);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:#eee4d2;
      color:var(--ink);
      font-family:Georgia,"Times New Roman",serif;
    }

    body{
      display:flex;
      justify-content:center;
    }

    .page{
      position:relative;
      width:min(100vw,720px);
      min-height:100vh;
      background:
        linear-gradient(rgba(255,251,244,.02),rgba(255,251,244,.02)),
        url("background.png") center top / cover no-repeat;
      padding:42px 18px 56px;
      overflow:hidden;
    }

    /* Creates breathing room around the functional countdown while
       keeping the original invitation artwork visible. */
    .content-wrap{
      position:relative;
      z-index:2;
      max-width:560px;
      margin:48vh auto 0;
    }

    .panel{
      position:relative;
      text-align:center;
      padding:28px 20px 26px;
      background:var(--panel);
      border:1px solid rgba(183,121,31,.78);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
    }

    .panel:before,
    .panel:after{
      content:"";
      position:absolute;
      inset:7px;
      pointer-events:none;
      border:1px solid rgba(183,121,31,.25);
    }

    .panel:after{
      inset:-7px;
      border:1px solid rgba(183,121,31,.28);
    }

    .lock{
      font-size:42px;
      line-height:1;
      margin:0 0 10px;
    }

    h1{
      margin:0;
      font-weight:500;
      font-size:clamp(25px,5.5vw,38px);
      letter-spacing:.17em;
    }

    .sub{
      margin-top:6px;
      font-size:clamp(16px,3.4vw,23px);
      letter-spacing:.13em;
    }

    .rule{
      width:120px;
      height:1px;
      margin:17px auto;
      background:var(--gold);
      position:relative;
    }

    .rule:after{
      content:"◆";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      padding:0 7px;
      background:rgba(255,250,242,.96);
      color:var(--gold);
      font-size:10px;
    }

    .unlock-label,
    .timezone,
    .tease,
    .unlocked-title{
      letter-spacing:.13em;
    }

    .unlock-label{
      font-size:14px;
      color:var(--gold);
      margin-bottom:6px;
    }

    .unlock-date{
      font-size:clamp(18px,4vw,27px);
      letter-spacing:.06em;
    }

    .timezone{
      margin-top:6px;
      color:#765526;
      font-size:12px;
    }

    .countdown{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:9px;
      margin-top:22px;
    }

    .box{
      background:rgba(255,255,255,.6);
      border:1px solid rgba(183,121,31,.85);
      padding:13px 4px 11px;
      min-width:0;
    }

    .num{
      font-size:clamp(29px,6.8vw,45px);
      line-height:1;
    }

    .lab{
      margin-top:7px;
      font-size:10px;
      letter-spacing:.12em;
      color:#765526;
    }

    .tease{
      margin-top:22px;
      font-size:12px;
      color:#503b21;
    }

    #unlocked{display:none}

    .unlocked-title{
      color:var(--gold);
      font-size:14px;
      margin-bottom:11px;
    }

    .question{
      font-size:clamp(27px,6vw,40px);
      line-height:1.25;
      max-width:470px;
      margin:6px auto 0;
    }

    .reveal{
      animation:reveal .9s ease both;
    }

    @keyframes reveal{
      from{opacity:0;transform:translateY(10px) scale(.985)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    @media (max-width:520px){
      .page{padding:28px 12px 42px}
      .content-wrap{margin-top:46vh}
      .panel{padding:23px 12px 22px}
      .countdown{gap:6px}
      .box{padding:11px 2px 10px}
      .lab{font-size:9px;letter-spacing:.08em}
    }

    @media (min-width:900px){
      .content-wrap{margin-top:44vh}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content-wrap">
      <section class="panel" aria-live="polite">
        <div id="locked">
          <div class="lock">🔒</div>
          <h1>THE SECRET</h1>
          <div class="sub">REMAINS SEALED</div>

          <div class="rule"></div>

          <div class="unlock-label">UNLOCKS ON</div>
          <div class="unlock-date">29 AUGUST 2026 · 5:30 PM</div>
          <div class="timezone">SINGAPORE TIME</div>

          <div class="countdown">
            <div class="box">
              <div class="num" id="days">00</div>
              <div class="lab">DAYS</div>
            </div>
            <div class="box">
              <div class="num" id="hours">00</div>
              <div class="lab">HRS</div>
            </div>
            <div class="box">
              <div class="num" id="mins">00</div>
              <div class="lab">MINS</div>
            </div>
            <div class="box">
              <div class="num" id="secs">00</div>
              <div class="lab">SECS</div>
            </div>
          </div>

          <div class="tease">SOMETHING SPECIAL AWAITS YOU</div>
        </div>

        <div id="unlocked" class="reveal">
          <div class="lock">🔓</div>
          <div class="unlocked-title">UNLOCKED</div>

          <div class="rule"></div>

          <div class="unlocked-title">YOUR QUESTION</div>
          <div class="question">What is the moving date of 203D?</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    // 29 August 2026, 5:30 PM Singapore Time (UTC+8)
    const unlockTime = new Date("2026-08-29T17:30:00+08:00").getTime();

    const locked = document.getElementById("locked");
    const unlocked = document.getElementById("unlocked");

    function pad(n){
      return String(n).padStart(2,"0");
    }

    function updateCountdown(){
      const diff = unlockTime - Date.now();

      if(diff <= 0){
        locked.style.display = "none";
        unlocked.style.display = "block";
        return;
      }

      const totalSeconds = Math.floor(diff/1000);
      const days = Math.floor(totalSeconds/86400);
      const hours = Math.floor((totalSeconds%86400)/3600);
      const mins = Math.floor((totalSeconds%3600)/60);
      const secs = totalSeconds%60;

      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("mins").textContent = pad(mins);
      document.getElementById("secs").textContent = pad(secs);
    }

    updateCountdown();
    setInterval(updateCountdown,1000);
  </script>
</body>
</html>
