<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Night in London</title>
  <style>
    :root{
      --gold:#b27a22;
      --gold-dark:#8b5e17;
      --ink:#171717;
      --cream:#fbf5e9;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:#eee4d2;
      color:var(--ink);
      font-family:Georgia,"Times New Roman",serif;
    }
    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    /* Keep the exact 2:3 composition of Picture 2. */
    .poster{
      position:relative;
      width:min(100vw,720px);
      aspect-ratio:2/3;
      background:url("background.png") center/100% 100% no-repeat;
      overflow:hidden;
    }

    /*
      This live panel sits inside Picture 2's existing gold frame.
      It deliberately covers the static lock/text/countdown printed
      in the artwork while preserving the surrounding frame, title,
      Big Ben, taxi, buildings and street scene.
    */
    .live-panel{
      position:absolute;
      left:22.5%;
      width:56.5%;
      top:35.0%;
      height:47.5%;
      background:rgba(251,245,233,.985);
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:4.5% 4.8% 4.2%;
    }

    .inner{
      width:100%;
    }

    .gold-lock{
      width:58px;
      height:52px;
      margin:0 auto 18px;
      position:relative;
      border:3px solid var(--gold-dark);
      border-radius:6px;
      background:linear-gradient(#c9953d,#a86f1e);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
    }
    .gold-lock:before{
      content:"";
      position:absolute;
      width:34px;
      height:32px;
      left:9px;
      top:-28px;
      border:5px solid var(--gold-dark);
      border-bottom:0;
      border-radius:20px 20px 0 0;
      background:transparent;
    }
    .gold-lock:after{
      content:"";
      position:absolute;
      width:7px;
      height:15px;
      left:23px;
      top:17px;
      border-radius:8px;
      background:#2a2115;
    }

    h1{
      margin:0;
      font-weight:500;
      font-size:clamp(23px,4.1vw,38px);
      letter-spacing:.14em;
    }
    .subtitle{
      margin-top:5px;
      font-size:clamp(15px,2.8vw,24px);
      letter-spacing:.1em;
    }

    .rule{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:16px auto;
      color:var(--gold);
    }
    .rule:before,.rule:after{
      content:"";
      width:58px;
      height:1px;
      background:var(--gold);
    }
    .diamond{font-size:11px}

    .unlock-label{
      color:var(--gold-dark);
      letter-spacing:.11em;
      font-size:clamp(11px,1.8vw,15px);
    }
    .unlock-date{
      margin-top:8px;
      font-size:clamp(18px,3.1vw,29px);
      letter-spacing:.035em;
      white-space:nowrap;
    }
    .timezone{
      margin-top:7px;
      font-size:clamp(10px,1.55vw,14px);
      letter-spacing:.12em;
      color:#5f4727;
    }

    .countdown{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:25px;
    }
    .timebox{
      border:1px solid var(--gold);
      padding:12px 2px 10px;
      background:rgba(255,255,255,.30);
    }
    .num{
      font-size:clamp(27px,4.7vw,44px);
      line-height:1;
    }
    .lab{
      margin-top:8px;
      font-size:clamp(8px,1.3vw,12px);
      letter-spacing:.08em;
      color:#57401f;
    }

    .key{
      margin-top:21px;
      font-size:30px;
      color:var(--gold-dark);
      line-height:1;
    }
    .tease{
      margin-top:16px;
      font-size:clamp(10px,1.55vw,14px);
      letter-spacing:.09em;
    }

    #unlocked{display:none}
    .unlocked-tag{
      color:var(--gold-dark);
      letter-spacing:.13em;
      font-size:clamp(12px,1.8vw,16px);
    }
    .question{
      margin:16px auto 0;
      max-width:95%;
      font-size:clamp(23px,4vw,38px);
      line-height:1.25;
    }
    .reveal{animation:reveal .9s ease both}
    @keyframes reveal{
      from{opacity:0;transform:translateY(8px) scale(.99)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    @media(max-width:520px){
      .live-panel{
        left:21.8%;
        width:58%;
        top:34.6%;
        height:48.5%;
        padding:5% 4.5% 4%;
      }
      .gold-lock{
        transform:scale(.72);
        margin-bottom:8px;
      }
      .rule{margin:10px auto}
      .countdown{gap:5px;margin-top:15px}
      .timebox{padding:8px 1px 7px}
      .key{font-size:22px;margin-top:12px}
      .tease{margin-top:10px}
    }
  </style>
</head>
<body>
  <main class="poster">
    <section class="live-panel" aria-live="polite">
      <div class="inner">
        <div id="locked">
          <div class="gold-lock" aria-hidden="true"></div>

          <h1>THE SECRET</h1>
          <div class="subtitle">REMAINS SEALED</div>

          <div class="rule"><span class="diamond">◆</span></div>

          <div class="unlock-label">UNLOCKS ON</div>
          <div class="unlock-date">29 AUGUST 2026 · 5:30 PM</div>
          <div class="timezone">SINGAPORE TIME</div>

          <div class="countdown">
            <div class="timebox"><div class="num" id="days">00</div><div class="lab">DAYS</div></div>
            <div class="timebox"><div class="num" id="hours">00</div><div class="lab">HRS</div></div>
            <div class="timebox"><div class="num" id="mins">00</div><div class="lab">MINS</div></div>
            <div class="timebox"><div class="num" id="secs">00</div><div class="lab">SECS</div></div>
          </div>

          <div class="key">⚿</div>
          <div class="tease">SOMETHING SPECIAL AWAITS YOU.</div>
        </div>

        <div id="unlocked" class="reveal">
          <div class="gold-lock" aria-hidden="true"></div>
          <div class="unlocked-tag">UNLOCKED</div>
          <div class="rule"><span class="diamond">◆</span></div>
          <div class="unlocked-tag">YOUR QUESTION</div>
          <div class="question">What is the moving date of 203D?</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 29 August 2026, 5:30 PM Singapore Time (UTC+8)
    const unlockTime = new Date("2026-08-29T17:30:00+08:00").getTime();

    const locked = document.getElementById("locked");
    const unlocked = document.getElementById("unlocked");

    const pad = n => String(n).padStart(2,"0");

    function updateCountdown(){
      const diff = unlockTime - Date.now();

      if(diff <= 0){
        locked.style.display = "none";
        unlocked.style.display = "block";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("mins").textContent = pad(mins);
      document.getElementById("secs").textContent = pad(secs);
    }

    updateCountdown();
    setInterval(updateCountdown,1000);
  </script>
</body>
</html>
